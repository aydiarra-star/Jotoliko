name: Jotoliko billing core tests

on:
  pull_request:
    paths:
      - "apps/api/src/billing/**"
      - ".github/workflows/billing-core-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  billing-core:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run isolated billing domain tests
        run: node --test apps/api/src/billing/billing-core.test.mjs

name: Jotoliko self-service signup page build

on:
  push:
    branches:
      - feat/self-service-signup-foundation
    paths:
      - "app/**"
      - "components/**"
      - "lib/**"
      - "next.config.mjs"
      - "package.json"
      - "package-lock.json"
      - ".env.example"
      - ".github/workflows/signup-page-build.yml"
  pull_request:
    branches:
      - feat/monthly-self-service-subscriptions
      - main
    paths:
      - "app/**"
      - "components/**"
      - "lib/**"
      - "next.config.mjs"
      - "package.json"
      - "package-lock.json"
      - ".env.example"
      - ".github/workflows/signup-page-build.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: signup-page-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static-site:
    name: Typecheck and static export
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      # Root tests import the signup service from the API. Install its own
      # dependencies and generate its Prisma client before root TypeScript checks.
      - name: Install API dependencies
        run: npm ci --prefix apps/api
      - name: Generate API Prisma client
        run: npm run api:prisma:generate
      - name: Typecheck site and imported signup service
        run: npm run typecheck
      - name: Build static site
        run: npm run build
        env:
          NEXT_PUBLIC_BASE_PATH: /Jotoliko
          NEXT_PUBLIC_SITE_URL: https://aydiarra-star.github.io/Jotoliko
          # No live API URL is supplied in CI. The page must build safely with
          # signup disabled rather than inventing prices or payment methods.
          NEXT_PUBLIC_API_BASE_URL: ""

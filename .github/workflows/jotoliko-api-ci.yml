name: Jotoliko API CI

# Vérifie l'API NestJS : génération du client Prisma depuis le schéma canonique,
# application des migrations sur une base vierge, détection de dérive entre le
# schéma et les migrations, typecheck et build.
#
# Ce workflow était auparavant en échec : `@types/express` était absent des
# dépendances, donc `nest build` échouait sur `src/auth/auth.types.ts`.

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: jotoliko-api-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    name: API (Prisma, migrations, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: jotoliko
          POSTGRES_PASSWORD: jotoliko
          POSTGRES_DB: jotoliko_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U jotoliko -d jotoliko_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://jotoliko:jotoliko@localhost:5432/jotoliko_ci

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/api/package-lock.json

      - name: Installation reproductible
        run: npm ci

      - name: Validation du schéma Prisma
        run: npm run prisma:validate

      - name: Génération du client Prisma
        run: npm run prisma:generate

      - name: Application des migrations
        run: npm run prisma:migrate:deploy

      - name: Détection de dérive schéma ⇄ migrations
        # Échoue si le schéma déclare une table ou une colonne qu'aucune
        # migration ne crée. C'est le garde-fou qui empêche la réapparition d'un
        # schéma parallèle non migré — la cause exacte de la panne de build
        # d'origine. Le diff est aussi publié en artefact pour être lisible
        # même lorsque les journaux du runner ne sont pas accessibles.
        id: drift
        run: |
          set +e
          npx prisma migrate diff \
            --from-migrations ../../prisma/migrations \
            --to-schema-datamodel ../../prisma/schema.prisma \
            --shadow-database-url "$DATABASE_URL" \
            --exit-code > drift.sql 2>&1
          code=$?
          set -e
          if [ "$code" -ne 0 ]; then
            # Le diff est publié en annotations : celles-ci restent lisibles via
            # l'API des check-runs même quand les journaux du runner ne sont pas
            # téléchargeables depuis l'environnement appelant.
            n=0
            while IFS= read -r line && [ "$n" -lt 60 ]; do
              [ -z "$line" ] && continue
              echo "::error title=DRIFT(${n})::$(printf '%s' "$line" | head -c 900)"
              n=$((n + 1))
            done < drift.sql
            echo "::error::Dérive détectée entre prisma/schema.prisma et prisma/migrations."
          fi
          echo "drift_exit=$code" >> "$GITHUB_OUTPUT"
          exit "$code"

      - name: Publier le diff de dérive
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: prisma-drift-diff
          path: apps/api/drift.sql
          if-no-files-found: ignore
          retention-days: 7

      - name: Typecheck
        # Les erreurs sont publiées en annotations : celles-ci restent lisibles
        # via l'API des check-runs quand les journaux du runner ne sont pas
        # téléchargeables depuis l'environnement appelant.
        run: |
          set +e
          npx tsc --noEmit > tsc.log 2>&1
          code=$?
          set -e
          if [ "$code" -ne 0 ]; then
            n=0
            while IFS= read -r line && [ "$n" -lt 40 ]; do
              [ -z "$line" ] && continue
              echo "::error title=TSC(${n})::$(printf '%s' "$line" | head -c 900)"
              n=$((n + 1))
            done < tsc.log
          fi
          exit "$code"

      - name: Build
        run: npm run build

      - name: Vérification du point d'entrée démarré
        # Le script `start` doit pointer vers l'artefact réellement produit :
        # une erreur de chemin ici ne se voit qu'au déploiement.
        run: test -f dist/apps/api/src/main.js

      - name: Audit des dépendances (informatif)
        # Les avis de sécurité transitifs sont signalés sans bloquer la CI :
        # une remédiation peut exiger une montée de version majeure.
        continue-on-error: true
        run: npm audit --audit-level=moderate

  # ---------------------------------------------------------------------------
  # Tests HTTP de bout en bout.
  #
  # Le serveur est lancé tel qu'il est livré (`node dist/apps/api/src/main.js`)
  # sur une vraie base PostgreSQL, et interrogé par de vraies requêtes HTTP : la
  # chaîne garde d'authentification → garde de permissions → validation → service
  # → Prisma → SQL → contraintes est réellement exercée. C'est ce que la
  # compilation et les tests unitaires ne peuvent pas prouver.
  # ---------------------------------------------------------------------------
  e2e:
    name: Tests HTTP de bout en bout (API + PostgreSQL 16)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: jotoliko
          POSTGRES_PASSWORD: jotoliko
          POSTGRES_DB: jotoliko_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U jotoliko -d jotoliko_e2e"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://jotoliko:jotoliko@localhost:5432/jotoliko_e2e

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Dépendances du dépôt (harnais de test)
        run: npm ci

      - name: Dépendances de l'API
        run: npm --prefix apps/api ci

      - name: Génération du client Prisma
        run: npm --prefix apps/api run prisma:generate

      - name: Build de l'API
        run: npm --prefix apps/api run build

      - name: Vérification du point d'entrée démarré
        run: test -f apps/api/dist/apps/api/src/main.js

      - name: Tests HTTP de bout en bout
        # Aucun test n'est ignoré ici : les suites qui exigent une base échouent
        # si DATABASE_URL est absent (voir tests/api-e2e/harness.ts).
        run: npm run test:e2e:api

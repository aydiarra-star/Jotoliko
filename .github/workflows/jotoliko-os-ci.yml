name: Jotoliko OS CI

on:
  push:
    branches:
      - chore/jotoliko-os-operations-2026
  pull_request:
    branches:
      - main
      - chore/jotoliko-os-operations-2026

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build

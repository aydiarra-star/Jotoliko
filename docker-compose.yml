services:
  postgres:
    image: postgres:16-alpine
    container_name: jotoliko-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: jotoliko
      POSTGRES_PASSWORD: jotoliko
      POSTGRES_DB: jotoliko
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jotoliko -d jotoliko"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: jotoliko-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  redis_data:
